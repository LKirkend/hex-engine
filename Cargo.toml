[package]
name = "hex_engine"
version = "0.1.0"
edition = "2021"
authors = ["Logan Kirkendall <Logan@LKAud.io>"]
description = "High-performance SIMD Bitboard Hex Nash Engine in Rust & C++"

[lib]
name = "hex_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hex_cli"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
